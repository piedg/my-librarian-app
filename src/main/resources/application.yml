spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library_demo_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: "admin1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  profiles:
    active: mysql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-minimum-32-bytes!!}
      expiration-minutes: 60
  scheduler:
    enabled: true
    expire-reservations:
   
      delay-ms: 3600000 
